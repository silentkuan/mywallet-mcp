services:
  mywallet-mcp:
    build: .
    container_name: mywallet-mcp
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - /root/.openclaw/workspace:/root/.openclaw/workspace:rw
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
